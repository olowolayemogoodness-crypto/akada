<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../app/fonts/fonts.css">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:#FAF7F2}
.row{display:flex;gap:28px;align-items:center;padding:26px 34px;border-bottom:1px solid #E7E1D8}
.row.dark{background:#14110F;color:#fff}
.k{width:60px;font-weight:800;font-size:28px;color:#F97316}
.big{width:200px;height:200px}.sm{width:64px;height:64px}.xs{width:32px;height:32px}
.lock{display:flex;align-items:center;gap:14px}.lock img{width:72px;height:72px}
.word{font-size:64px;font-weight:800;letter-spacing:-2px}.word i{font-style:normal;color:#F97316}
.name{font-size:15px;font-weight:700;color:#78716C;width:170px}.dark .name{color:#A8A29E}
</style></head><body>
<script>
const L=[['D','logo-d-bird.svg','Ebi the weaver bird: a mascot like Duolingo\'s owl. Weavers are found all over Nigeria and build clever nests.'],['E','logo-e-adire.svg','Adire e: Yoruba adire indigo pattern behind a bold e. Unmistakably Nigerian.'],['F','logo-f-bubble.svg','Talking e: a chat bubble shaped like e. Learning that talks like us. Nigeria green.'],['G','logo-g-swipe.svg','Swipe spark: stacked short-video cards with a lightning bolt. Scrolling, but it charges your brain.']];
for(const [k,f,n] of L){for(const dark of [false,true]){document.write(`<div class="row ${dark?'dark':''}"><div class="k">${dark?'':k}</div><img class="big" src="${f}"><img class="sm" src="${f}"><img class="xs" src="${f}"><div class="lock"><img src="${f}"><div class="word">edu<i>.</i></div></div><div class="name">${dark?'':n}</div></div>`)}}
</script></body></html>
